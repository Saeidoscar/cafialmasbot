name: Build PayamResan (APK + EXE)

# ساخت خودکار دو خروجی نهایی:
#   1) payamresan-android-apk   → اپ اندروید (.apk) برای ارسال با سیم‌کارت گوشی
#   2) payamresan-windows-exe   → برنامهٔ ویندوز (.exe) برای تحلیل CSV و کنترل ارسال
#
# Builds both deliverables on every push/dispatch and stores them as run artifacts.
# Hints for the repository owner: open the run, then read the "Artifacts" section.

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "ساخت APK اندروید"
        type: boolean
        default: true
      build_windows:
        description: "ساخت EXE ویندوز"
        type: boolean
        default: true
  push:
    branches: ["main", "arena/**"]
    paths:
      - "bulksms/**"
      - ".github/workflows/build-payamresan.yml"

permissions:
  contents: read

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # کلید امضا: اگر Secret موجود باشد استفاده می‌شود، وگرنه یک کلید ثابت از کش بازیابی
      # یا ساخته می‌شود تا امضای نسخه‌ها بین بیلدها یکی بماند (نصب به‌روزرسانی ممکن شود).
      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: .signing
          key: payamresan-signing-key-v1

      - name: Prepare signing key (secrets > cache > new)
        env:
          KEYSTORE_B64: ${{ secrets.PAYAMRESAN_KEYSTORE_B64 }}
          PW: ${{ secrets.PAYAMRESAN_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p .signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > .signing/payamresan.p12
            echo "استفاده از کلید ذخیره‌شده در Secrets"
          fi
          if [ ! -f .signing/payamresan.p12 ]; then
            PASS="${PW:-payamresan}"
            keytool -genkeypair -v \
              -keystore .signing/payamresan.p12 -storetype PKCS12 \
              -storepass "$PASS" -keypass "$PASS" \
              -alias payamresan -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=PayamResan, OU=Personal, O=PayamResan, L=Tehran, C=IR"
            echo "$PASS" > .signing/password.txt
            echo "کلید امضای جدید ساخته شد (برای نسخه‌های بعدی در کش نگه داشته می‌شود)"
          fi
          PW_USE="$PW"
          if [ -z "$PW_USE" ] && [ -f .signing/password.txt ]; then PW_USE="$(cat .signing/password.txt)"; fi
          PW_USE="${PW_USE:-payamresan}"
          echo "RELEASE_STORE_FILE=$PWD/.signing/payamresan.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$PW_USE" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=payamresan" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PW_USE" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p bulksms/android --no-daemon --stacktrace \
            -PversionCodeIn=${{ github.run_number }} \
            -PversionNameIn=1.0.${{ github.run_number }} \
            assembleDebug assembleRelease 2>&1 | tee build-android.log

      # در صورت خطا، پیام‌های مهم به‌صورت annotation روی اجرا ثبت می‌شوند تا در
      # صفحهٔ Actions (و API) قابل دیدن باشند.
      - name: Report Android build errors
        if: failure()
        run: |
          echo "----- آخرین خطوط لاگ -----"
          tail -50 build-android.log || true
          echo "----- خطاهای کلیدی ====="
          grep -n -E "^e: |error:|ERROR:|What went wrong|FAILURE:|Execution failed|Could not (resolve|find|download)|Caused by|FAILED$|Unresolved|Compilation error|A problem occurred" build-android.log 2>/dev/null \
            | head -25 | cut -c1-450 \
            | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          find bulksms/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out
          (cd out && sha256sum *.apk > SHA256SUMS-apk.txt)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: payamresan-android-apk
          path: out/**
          if-no-files-found: error
          retention-days: 90

      - name: Save signing key if newly created
        if: success() && steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out-key
          cp .signing/payamresan.p12 out-key/ 2>/dev/null || true
          if [ -f .signing/password.txt ]; then
            printf 'رمز کلید: %s\n\nاین کلید امضای نسخه‌های این برنامه است.\nبرای اینکه امضای APKهای بعدی تغییر نکند، محتوای base64 این فایل را در\nSettings → Secrets and variables → Actions به نام PAYAMRESAN_KEYSTORE_B64\nو رمز را به نام PAYAMRESAN_KEYSTORE_PASSWORD ذخیره کنید:\n\n  base64 -w0 payamresan.p12\n' "$(cat .signing/password.txt)" > out-key/README.txt
          fi
          ls -la out-key

      - name: Upload signing key
        if: success() && steps.keycache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: payamresan-signing-key
          path: out-key/**
          retention-days: 90

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: bulksms/windows/requirements.txt

      - name: Install dependencies
        working-directory: bulksms/windows
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test core rules (no GUI)
        working-directory: bulksms/windows
        run: |
          python tools/selftest.py *>&1 | Tee-Object -FilePath selftest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test GUI (offscreen) + screenshots
        working-directory: bulksms/windows
        run: |
          python tools/gui_smoke.py gui-preview *>&1 | Tee-Object -FilePath gui-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows errors
        if: failure()
        run: |
          Get-ChildItem -Filter *.log | ForEach-Object {
            Write-Output "----- $($_.Name) (آخرین خطوط) -----"
            Get-Content $_.FullName -Tail 30
          }
          Get-ChildItem -Filter *.log | Get-Content |
            Select-String -Pattern "Traceback|ModuleNotFoundError|ImportError|SyntaxError|UnicodeEncodeError|Error:|FAIL " |
            Select-Object -First 20 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }

      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payamresan-gui-preview
          path: bulksms/windows/gui-preview/**
          if-no-files-found: warn
          retention-days: 30

      - name: Build EXE
        working-directory: bulksms/windows
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PayamResan-Setup `
            --add-data "payamresan/icon.png;payamresan" `
            --exclude-module tkinter `
            --exclude-module PySide6.QtWebEngineCore `
            PayamResan.py *>&1 | Tee-Object -FilePath exe-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        if: success()
        working-directory: bulksms/windows
        run: |
          New-Item -ItemType Directory -Force -Path ..\..\out | Out-Null
          Copy-Item dist\PayamResan-Setup.exe ..\..\out\
          Copy-Item run.bat,README.md ..\..\out\
          Get-FileHash ..\..\out\PayamResan-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  PayamResan-Setup.exe" } | Set-Content ..\..\out\SHA256SUMS-exe.txt
          Get-ChildItem ..\..\out

      - name: Upload EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: payamresan-windows-exe
          path: out/**
          if-no-files-found: error
          retention-days: 90
